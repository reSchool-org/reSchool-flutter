name: Build Android, Windows & Linux

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (artifacts only, no publishing)
        type: choice
        options: [android, windows, linux, all]
        default: windows
        required: true

permissions:
  contents: read

jobs:
  build-android:
    if: (inputs.platform == 'android' || inputs.platform == 'all') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false

      - name: Package bundled cloud server
        run: python3 .github/scripts/package_cloud_server.py

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Provision Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Build signed APK and App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Package bundled cloud server
        run: python3 .github/scripts/package_cloud_server.py

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Create Windows ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath reSchool-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build
          path: reSchool-windows.zip
          if-no-files-found: error

  build-linux:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Package bundled cloud server
        run: python3 .github/scripts/package_cloud_server.py

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: flutter build linux --release --no-pub

      - name: Create Linux archive
        run: tar -czf reSchool-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-build
          path: reSchool-linux.tar.gz
          if-no-files-found: error
