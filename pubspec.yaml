name: reschool
description: "ReSchool student portal for homework, schedules, grades, and school chats."

publish_to: 'none' 

version: 2.0.2+3

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3
  http: ^1.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.0
  provider: ^6.1.5+1
  intl: any
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  permission_handler: ^11.0.0
  share_plus: ^13.3.0
  image_picker: ^1.0.0
  file_picker: ^12.3.0
  mime: ^2.0.0
  url_launcher: ^6.3.1
  # версия 10 переносит данные версии 9, а в версии 11 этот переход уже убрали
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^13.2.0
  home_widget:
    path: third_party/home_widget
  workmanager: ^0.10.10
  pasteboard:
    path: third_party/pasteboard
  package_info_plus: ^10.2.1
  pointycastle: ^4.0.0
  app_links: ^6.4.0
  local_auth: ^2.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  flutter_widget_from_html_core: ^0.17.0
  flutter_math_fork: ^0.7.4
  html: ^0.15.6
  dartssh2: ^4.0.0

dependency_overrides:
  workmanager_android:
    path: third_party/workmanager_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  path_provider_platform_interface: ^2.1.2
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4 

flutter:
  # Native release builds use the reviewed CocoaPods lockfiles.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/devices.json
    - assets/cloud/
    - assets/icon.png
    - assets/logo.svg

flutter_launcher_icons:
  android: true
  ios: true
  # Regenerate all platforms with: python3 scripts/generate_icons.py
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon-foreground.png"
  adaptive_icon_foreground_inset: 24
  image_path_ios: "assets/icon-ios.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
    image_path: "assets/icon-macos.png"
  windows:
    generate: true
    icon_size: 256
