services:
  browser_bridge:
    build:
      context: .
      dockerfile: browser_transport/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2
    network_mode: host
    env_file: .env
    environment:
      BROWSER_RUNTIME_DIR: /app/runtime
      BROWSER_SERVER_URL: ${BROWSER_SERVER_URL:-${PUBLIC_BASE_URL:-https://127.0.0.1:4443}}
    volumes:
      - ./server_advanced/runtime/browser:/app/runtime
