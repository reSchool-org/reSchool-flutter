name: Apple External TestFlight Status

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-testflight-status
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: apple-ios-testflight
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify TestFlight status checks before loading credentials
        run: python3 -m unittest discover -s deploy/tests -p 'test_check_testflight_status.py' -v
      - name: Publish app.txt when the latest release is available to external testers
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL || 'https://testflight.apple.com/join/JqADzPK9' }}
        run: python3 deploy/check_testflight_status.py --repo "$GITHUB_REPOSITORY"
